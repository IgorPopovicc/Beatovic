<main class="coming-soon" aria-labelledby="coming-soon-title">
  <div class="edge-shape edge-shape--top" aria-hidden="true"></div>
  <div class="edge-shape edge-shape--right" aria-hidden="true"></div>
  <div class="red-orbit" aria-hidden="true"></div>

  <div class="coming-soon__shell">
    <header class="brand">
      <img
        class="brand__logo"
        ngSrc="assets/images/logo/planets_text.png"
        alt="PlanetSport"
        width="716"
        height="108"
        priority
      />
      <span class="brand__label">ONLINE PRODAVNICA</span>
    </header>

    <div class="composition">
      <section class="announcement">
        <div class="announcement__content">
          <p class="eyebrow">NOVO POGLAVLJE JE BLIZU</p>
          <h1 id="coming-soon-title">
            <span>USKORO</span>
            <strong>LIVE</strong>
          </h1>

          <div class="accent-line" aria-hidden="true"></div>
          <p class="intro">Nova online prodavnica<br />je skoro tu.</p>

          <div class="domain" aria-label="Adresa online prodavnice">
            <span class="domain__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9"></circle>
                <path
                  d="M3.5 12h17M12 3c2.2 2.45 3.35 5.45 3.35 9S14.2 18.55 12 21M12 3C9.8 5.45 8.65 8.45 8.65 12S9.8 18.55 12 21"
                ></path>
              </svg>
            </span>
            <span>{{ storefrontHost }}</span>
          </div>
        </div>

        <div class="announcement__mark" aria-hidden="true">PS</div>
      </section>

      <aside class="stay-tuned" aria-labelledby="stay-tuned-title">
        <div class="stay-tuned__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5"></circle>
            <path d="M12 7v5l3.3 2"></path>
          </svg>
        </div>
        <div>
          <h2 id="stay-tuned-title">STAY TUNED</h2>
          <p>Velike stvari dolaze.</p>
        </div>
      </aside>
    </div>
  </div>
</main>

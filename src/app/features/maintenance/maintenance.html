<main class="maintenance" aria-labelledby="maintenance-title">
  <div class="shape shape--one" aria-hidden="true"></div>
  <div class="shape shape--two" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <section class="maintenance-card">
    <img
      class="maintenance-logo"
      ngSrc="assets/images/logo/planets_text.png"
      alt="Planeta webshop"
      width="232"
      height="35"
      priority
    />

    <div class="status"><span aria-hidden="true"></span> PLANIRANO ODRŽAVANJE</div>
    <p class="eyebrow">ONLINE PRODAVNICA</p>
    <h1 id="maintenance-title">RADIMO NA POBOLJŠANJIMA</h1>
    <p class="message">{{ message }}</p>
    <p class="thanks">Hvala na strpljenju.</p>

    <div class="signature" aria-hidden="true">
      <span></span>
      PLANETA SPORT
      <span></span>
    </div>
  </section>
</main>

<section class="admin-layout">
  <div class="shell">
    <header class="head" role="region" aria-label="Zaglavlje administratorskog panela">
      <div class="left">
        <div class="badge">ADMIN</div>

        <div class="who">
          <div class="label">Prijavljeni korisnik</div>
          <div class="value">{{ username() }}</div>
        </div>
      </div>

      <button class="btn-logout" type="button" (click)="logout()">Odjavi se</button>
    </header>

    <aside class="security-warning" role="alert">
      <strong>Upozorenje:</strong> Ova sekcija namijenjena je isključivo ovlašćenim
      administratorskim korisnicima.
    </aside>

    <div class="body">
      <nav class="nav" aria-label="Administratorska navigacija">
        <a
          routerLink="/admin/panel"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Kontrolna tabla
        </a>

        <a routerLink="/admin/products" routerLinkActive="active"> Proizvodi </a>

        @if (isAdmin()) {
          <a routerLink="/admin/priorities" routerLinkActive="active"> Prioriteti </a>
        }

        <a routerLink="/admin/orders" routerLinkActive="active"> Narudžbine </a>

        <a routerLink="/admin/discounts" routerLinkActive="active"> Popusti </a>

        <a routerLink="/admin/newsletter" routerLinkActive="active"> Newsletter </a>

        <a routerLink="/admin/contact" routerLinkActive="active"> Kontakt poruke </a>

        <a routerLink="/admin/coupons" routerLinkActive="active"> Kuponi </a>
      </nav>

      <main class="content" role="region" aria-label="Admin sadržaj">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</section>

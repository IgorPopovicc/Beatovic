@if (showStandaloneComingSoon()) {
  <router-outlet />
} @else if (showMaintenance()) {
  <app-maintenance />
} @else {
  <app-navbar></app-navbar>
  <div class="page">
    @if (showBackendFallback()) {
      <app-backend-fallback (retry)="retryBackend()" />
    } @else {
      <router-outlet />
    }
  </div>
  <app-cart-add-toast />
  <app-footer></app-footer>
  @defer (on idle) {
    <app-cookie-consent />
  }
}

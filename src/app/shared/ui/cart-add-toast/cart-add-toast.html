@if (rendered()) {
  <div class="toast-wrap" [class.show]="visible()" aria-live="polite" aria-atomic="true">
    <div
      class="toast"
      [class.no-action]="action() !== 'cart'"
      [class.error]="kind() === 'error'"
      [class.info]="kind() === 'info'"
      [attr.role]="kind() === 'error' ? 'alert' : 'status'"
    >
      <div class="icon" aria-hidden="true">{{ icon() }}</div>

      <div class="body">
        <div class="title">{{ title() }}</div>
        @if (subtitle(); as line) {
          <div class="subtitle">{{ line }}</div>
        }
      </div>

      @if (action() === 'cart') {
        <a class="view-cart" routerLink="/cart" (click)="onViewCart()">Pogledaj korpu</a>
      }

      <button type="button" class="close-btn" (click)="close()" aria-label="Zatvori obavještenje">
        ✕
      </button>
    </div>
  </div>
}

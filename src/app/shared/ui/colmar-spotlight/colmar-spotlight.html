<section class="colmar-spotlight" aria-labelledby="colmar-spotlight-title">
  <picture class="campaign-media" aria-hidden="true">
    <img
      [src]="config.campaignImage"
      alt=""
      width="1600"
      height="853"
      loading="lazy"
      decoding="async"
    />
  </picture>
  <div class="overlay" aria-hidden="true"></div>

  <div class="content">
    <div class="copy">
      <p class="eyebrow">{{ config.eyebrow }}</p>
      <h2 id="colmar-spotlight-title">{{ config.headline }}</h2>
      <p>{{ config.description }}</p>

      <a class="cta" [routerLink]="config.ctaLink" [queryParams]="config.ctaQueryParams">
        {{ config.ctaLabel }}
      </a>
    </div>

    <div class="campaign-note" aria-hidden="true">
      <span>01</span>
      <strong>URBAN / ALPINE</strong>
      <small>Za promjenljive uslove</small>
    </div>
  </div>
</section>
